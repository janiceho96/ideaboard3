<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#263D5B" flood-opacity="0.14"/></filter>
    <style>.title{font:800 46px Arial;fill:#161616}.sub{font:400 24px Arial;fill:#667085}.label{font:800 24px Arial;fill:#263D5B}.tiny{font:500 18px Arial;fill:#667085}.white{font:800 24px Arial;fill:#fff}</style>
  </defs>
  <rect width="1200" height="800" fill="#f6f4ec"/>
  <text x="600" y="86" text-anchor="middle" class="title">Plan a Marketing Campaign</text>
  <text x="600" y="126" text-anchor="middle" class="sub">Map goals, channels, content, and launch tasks in one view.</text>
  <g transform="translate(125 185)" filter="url(#shadow)">
    <rect width="950" height="500" rx="18" fill="#ffffff"/>
    <rect x="58" y="62" width="190" height="330" rx="16" fill="#263D5B"/>
    <text x="90" y="114" class="white">Goal</text>
    <text x="90" y="154" font-family="Arial" font-size="22" fill="#ffffff">500 signups</text>
    <text x="90" y="194" font-family="Arial" font-size="18" fill="#c9d7e8">by launch week</text>
    <rect x="300" y="62" width="250" height="88" rx="14" fill="#e9f7fd"/>
    <text x="330" y="116" class="label">TikTok demo</text>
    <rect x="300" y="184" width="250" height="88" rx="14" fill="#fff48a"/>
    <text x="330" y="238" class="label">Email list</text>
    <rect x="300" y="306" width="250" height="88" rx="14" fill="#ffffff" stroke="#49B6E5" stroke-width="4"/>
    <text x="330" y="360" class="label">Product Hunt</text>
    <rect x="610" y="62" width="280" height="332" rx="16" fill="#faf8f0" stroke="#e4dfcf" stroke-width="2"/>
    <text x="642" y="116" class="label">Launch tasks</text>
    <path d="M642 158h178 M642 198h150 M642 238h190 M642 278h132 M642 318h164" stroke="#49B6E5" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
