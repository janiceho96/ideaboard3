<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#263D5B" flood-opacity="0.18"/>
    </filter>
    <filter id="noteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#263D5B" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#1747d4"/>
    </marker>
    <style>
      .title { font: 800 58px Arial, Helvetica, sans-serif; fill: #161616; }
      .subtitle { font: 400 24px Arial, Helvetica, sans-serif; fill: #5b6170; }
      .label { font: 700 21px Arial, Helvetica, sans-serif; fill: #202124; }
      .tiny { font: 500 15px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .mono { font: 600 16px "Courier New", monospace; fill: #263D5B; }
      .buttonText { font: 800 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .noteText { font: 700 22px Arial, Helvetica, sans-serif; fill: #1e293b; }
      .noteSmall { font: 500 18px Arial, Helvetica, sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1800" height="1120" rx="0" fill="#efede4"/>
  <rect x="35" y="0" width="1730" height="1088" rx="0" fill="#f6f4ec"/>

  <text x="900" y="104" text-anchor="middle" class="title">Bring Your Ideas to Life with Ideaboard</text>
  <text x="900" y="146" text-anchor="middle" class="subtitle">A private visual workspace for planning, brainstorming, PDFs, slides, and messy thinking.</text>

  <g transform="translate(516 265)">
    <circle cx="0" cy="0" r="72" fill="#ffffff" filter="url(#softShadow)"/>
    <circle cx="0" cy="-4" r="38" fill="#49B6E5"/>
    <path d="M-26 9 h52 M-26 -7 h52 M-26 25 h36" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="102" text-anchor="middle" class="tiny">Capture</text>
  </g>
  <g transform="translate(708 265)">
    <circle cx="0" cy="0" r="72" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="-34" y="-39" width="68" height="84" rx="8" fill="#263D5B"/>
    <rect x="-22" y="-25" width="44" height="9" rx="3" fill="#fdf48b"/>
    <rect x="-22" y="-7" width="44" height="9" rx="3" fill="#49B6E5"/>
    <rect x="-22" y="12" width="28" height="9" rx="3" fill="#ffffff"/>
    <text x="0" y="102" text-anchor="middle" class="tiny">Import</text>
  </g>
  <g transform="translate(900 265)">
    <circle cx="0" cy="0" r="72" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="-42" y="-36" width="84" height="72" rx="10" fill="#fdf48b"/>
    <path d="M-24 -12 h48 M-24 7 h38" stroke="#263D5B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="31" cy="25" r="10" fill="#49B6E5"/>
    <text x="0" y="102" text-anchor="middle" class="tiny">Arrange</text>
  </g>
  <g transform="translate(1092 265)">
    <circle cx="0" cy="0" r="72" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="-40" y="-28" width="80" height="56" rx="9" fill="#e9f7fd" stroke="#263D5B" stroke-width="6"/>
    <path d="M-16 3 l16 16 l28 -36" fill="none" stroke="#49B6E5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="102" text-anchor="middle" class="tiny">Organize</text>
  </g>
  <g transform="translate(1284 265)">
    <circle cx="0" cy="0" r="72" fill="#ffffff" filter="url(#softShadow)"/>
    <path d="M-30 -22 h60 v55 h-60z" fill="#263D5B"/>
    <path d="M-16 -40 h32 v24 h-32z" fill="#49B6E5"/>
    <path d="M-16 10 h32 M-16 25 h32" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <text x="0" y="102" text-anchor="middle" class="tiny">Export</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="155" y="395" width="1490" height="596" rx="18" fill="#ffffff"/>
    <rect x="155" y="395" width="1490" height="76" rx="18" fill="#f8fafc"/>
    <rect x="155" y="452" width="1490" height="1" fill="#e5e7eb"/>
  </g>

  <text x="206" y="445" class="label">Ideaboard canvas</text>
  <text x="206" y="481" class="tiny">Plan projects visually - add ideas, slides, PDFs, text blocks, and frameworks on one private board</text>

  <rect x="209" y="526" width="1390" height="393" rx="14" fill="#faf8f0" stroke="#e5e1d4" stroke-width="2"/>
  <path d="M209 526 h1390 v393 h-1390z" fill="url(#grid)" opacity="0"/>
  <g opacity="0.32" stroke="#d9d2bd" stroke-width="1">
    <path d="M259 526 v393 M309 526 v393 M359 526 v393 M409 526 v393 M459 526 v393 M509 526 v393 M559 526 v393 M609 526 v393 M659 526 v393 M709 526 v393 M759 526 v393 M809 526 v393 M859 526 v393 M909 526 v393 M959 526 v393 M1009 526 v393 M1059 526 v393 M1109 526 v393 M1159 526 v393 M1209 526 v393 M1259 526 v393 M1309 526 v393 M1359 526 v393 M1409 526 v393 M1459 526 v393 M1509 526 v393 M1559 526 v393"/>
    <path d="M209 576 h1390 M209 626 h1390 M209 676 h1390 M209 726 h1390 M209 776 h1390 M209 826 h1390 M209 876 h1390"/>
  </g>

  <g transform="translate(286 577)">
    <rect width="246" height="145" rx="12" fill="#fff7a6" stroke="#263D5B" stroke-width="3"/>
    <text x="24" y="42" class="label">Campaign idea</text>
    <text x="24" y="78" class="tiny">Launch local-first</text>
    <text x="24" y="104" class="tiny">planning toolkit</text>
  </g>

  <g transform="translate(592 620)">
    <rect width="268" height="160" rx="12" fill="#e9f7fd" stroke="#263D5B" stroke-width="3"/>
    <text x="24" y="44" class="label">PDF slides</text>
    <rect x="24" y="65" width="220" height="70" rx="8" fill="#ffffff"/>
    <path d="M47 99 h174 M47 117 h126" stroke="#49B6E5" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="translate(935 556)">
    <rect width="322" height="224" rx="12" fill="#ffffff" stroke="#263D5B" stroke-width="3"/>
    <rect x="22" y="24" width="278" height="40" rx="8" fill="#263D5B"/>
    <text x="40" y="51" class="buttonText">Workshop plan</text>
    <path d="M42 98 h220 M42 132 h178 M42 166 h235" stroke="#d7dee8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g transform="translate(1289 660)">
    <rect width="244" height="142" rx="12" fill="#ffffff" stroke="#49B6E5" stroke-width="4"/>
    <text x="22" y="42" class="label">Export board</text>
    <text x="22" y="80" class="tiny">Save and share your</text>
    <text x="22" y="106" class="tiny">work as a file</text>
  </g>

  <g transform="translate(238 948)">
    <rect width="300" height="86" rx="12" fill="#263D5B"/>
    <text x="26" y="36" class="buttonText">Local-first</text>
    <text x="26" y="64" class="tiny" fill="#ffffff">No cloud account required</text>
  </g>
  <g transform="translate(572 948)">
    <rect width="300" height="86" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="26" y="36" class="label">Fast visual planning</text>
    <text x="26" y="64" class="tiny">Drag, resize, group, arrange</text>
  </g>
  <g transform="translate(906 948)">
    <rect width="300" height="86" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="26" y="36" class="label">PDF and slide friendly</text>
    <text x="26" y="64" class="tiny">Turn documents into boards</text>
  </g>
  <g transform="translate(1240 948)">
    <rect width="300" height="86" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text x="26" y="36" class="label">Easy to launch</text>
    <text x="26" y="64" class="tiny">One click from the folder</text>
  </g>

  <g transform="translate(17 530)" filter="url(#noteShadow)">
    <rect width="190" height="134" rx="2" fill="#fff48a"/>
    <text x="22" y="42" class="noteText">Add ideas</text>
    <text x="22" y="72" class="noteSmall">as sticky cards</text>
    <text x="22" y="101" class="noteSmall">on a canvas</text>
  </g>
  <path d="M207 598 C245 596, 260 606, 286 632" fill="none" stroke="#1747d4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <g transform="translate(1576 435)" filter="url(#noteShadow)">
    <rect width="205" height="142" rx="2" fill="#fff48a"/>
    <text x="28" y="42" class="noteText">Import</text>
    <text x="28" y="72" class="noteSmall">PDFs and</text>
    <text x="28" y="101" class="noteSmall">slides</text>
  </g>
  <path d="M1576 510 C1510 536, 1450 583, 1260 638" fill="none" stroke="#1747d4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <g transform="translate(21 704)" filter="url(#noteShadow)">
    <rect width="202" height="128" rx="2" fill="#fff48a"/>
    <text x="23" y="41" class="noteText">Arrange</text>
    <text x="23" y="72" class="noteSmall">everything in</text>
    <text x="23" y="101" class="noteSmall">one workspace</text>
  </g>
  <path d="M223 759 C330 768, 470 742, 592 700" fill="none" stroke="#1747d4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <g transform="translate(1596 840)" filter="url(#noteShadow)">
    <rect width="178" height="132" rx="2" fill="#fff48a"/>
    <text x="22" y="41" class="noteText">Share</text>
    <text x="22" y="72" class="noteSmall">your plan</text>
    <text x="22" y="101" class="noteSmall">offline</text>
  </g>
  <path d="M1596 891 C1550 865, 1519 834, 1488 802" fill="none" stroke="#1747d4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <rect x="742" y="831" width="316" height="58" rx="29" fill="#111827"/>
  <text x="900" y="867" text-anchor="middle" class="buttonText">Start planning in Ideaboard</text>
</svg>
