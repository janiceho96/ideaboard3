<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#263D5B" flood-opacity="0.14"/></filter>
    <style>.title{font:800 46px Arial;fill:#161616}.sub{font:400 24px Arial;fill:#667085}.label{font:800 24px Arial;fill:#263D5B}.tiny{font:500 18px Arial;fill:#667085}</style>
  </defs>
  <rect width="1200" height="800" fill="#f6f4ec"/>
  <text x="600" y="86" text-anchor="middle" class="title">Brainstorm a New Project</text>
