    <rect x="52" y="54" width="846" height="360" rx="16" fill="#faf8f0" stroke="#e4dfcf" stroke-width="2"/>
    <g opacity="0.35" stroke="#d8d0bb"><path d="M102 54v360 M152 54v360 M202 54v360 M252 54v360 M302 54v360 M352 54v360 M402 54v360 M452 54v360 M502 54v360 M552 54v360 M602 54v360 M652 54v360 M702 54v360 M752 54v360 M802 54v360 M852 54v360"/><path d="M52 104h846 M52 154h846 M52 204h846 M52 254h846 M52 304h846 M52 354h846"/></g>
    <rect x="110" y="110" width="220" height="110" rx="12" fill="#fff48a" stroke="#263D5B" stroke-width="3"/>
